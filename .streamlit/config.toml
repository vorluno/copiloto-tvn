# Minimal monochrome theme (J-15). Fonts are served by the app itself (app/static/fonts, OFL):
# the demo runs without internet, so nothing is loaded from a font CDN.
[theme]
base = "light"
primaryColor = "#151515"
backgroundColor = "#F4F4F2"
secondaryBackgroundColor = "#EBEBE8"
textColor = "#151515"
linkColor = "#151515"
font = "Archivo, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
headingFont = "Archivo, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
codeFont = "'IBM Plex Mono', Menlo, Consolas, monospace"
borderColor = "#DCDCD8"
dataframeBorderColor = "#DCDCD8"
dataframeHeaderBackgroundColor = "#EBEBE8"
baseRadius = "12px"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Archivo"
url = "app/static/fonts/archivo-latin-var.woff2"
weight = "400 800"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-500.woff2"
weight = 500

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

# T10: the demo must not reach the network. Streamlit's usage stats call data.streamlit.io.
[browser]
gatherUsageStats = false
